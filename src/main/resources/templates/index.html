<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mailform</title>
    <link rel="stylesheet" href="/style/style.css" />
    <style>
      .errors {
      color: red;
      font-size: 14px;
      padding-left: 10px;
      }
    </style>
  </head>
  <body>

    <h1>お問い合わせフォーム</h1>
    <a href="/list">お問い合わせ一覧表示</a>

  <form th:action="@{/confirm}" method="post" th:object="${form}">
      <table>
        <tr>
          <th><label for="name">お名前</label></th>
          <td><input type="text" name="name" th:field="*{name}"></td>
          <td th:if="${#fields.hasErrors('name')}" class="errors" th:errors="*{name}"></td>
        </tr>
        <tr>
          <th><label for="email">メールアドレス</label></th>
          <td><input type="email" name="email" th:field="*{email}"><br></td>
          <td th:if="${#fields.hasErrors('email')}" class="errors" th:errors="*{email}"></td>
        </tr>
        <tr>
          <th><label for="subject">件名</label></th>
          <td><input type="text" name="subject" th:field="*{subject}"><br></td>
          <td th:if="${#fields.hasErrors('subject')}" class="errors" th:errors="*{subject}"></td>
        </tr>
        <tr>
          <th><label for="content">お問い合わせ内容</label></th>
          <td><textarea name="content" th:field="*{content}"></textarea><br></td>
          <td th:if="${#fields.hasErrors('content')}" class="errors" th:errors="*{content}"></td>
        </tr>
        <tr>
          <td><button type="submit">確認</button></td>
        </tr>
      </table>
    </form>

  </body>
</html>
