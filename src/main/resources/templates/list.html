<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mailform</title>
  </head>
  <body>

    <h1>お問い合わせ一覧</h1>
    <div>
        <form th:action="@{/list}" method="post" th:object="${form}">
            <div><input type="text" name="name"  placeholder="お名前を入力"/></div>
            <div><input type="text" name="email"  placeholder="メールアドレスを入力"/></div>
            <div><button type="submit">検索する</button></div>
        </form>
    </div>

    <div>
        <table>
            <thead>
                <tr>
                    <th>お名前</th>
                    <th>メールアドレス</th>
                    <th>件名</th>
                    <th>お問い合わせ内容</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="form : ${forms}">
                    <td th:text="${form.name}"></td>
                    <td th:text="${form.email}"></td>
                    <td th:text="${form.subject}"></td>
                    <td th:text="${form.content}"></td>
                    <td><button type="button" th:onclick="'location.href=\'/list/update/' + ${form.id} + '\''">編集</button></td>
                    <td><button type="button" th:onclick="'location.href=\'/list/delete/' + ${form.id} + '\''">削除</button></td>
                </tr>
                <div th:text="${message}"></div>
            </tbody>
        </table>
    </div>
    <button type="button" onclick="location.href='/'" >トップに戻る</button>

  </body>
</html>
