<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mailform</title>
    <link rel="stylesheet" href="/style/style.css">
  </head>
  <body>

    <h1>お問い合わせ一覧</h1>
    <div>
        <form th:action="@{/list}" method="post" th:object="${contact}">
            <div><input type="text" name="name"  placeholder="お名前を入力"/></div>
            <div><input type="text" name="email"  placeholder="メールアドレスを入力"/></div>
            <div><button type="submit">検索する</button></div>
        </form>
    </div>

    <div>
        <table>
            <thead>
                <tr>
                    <th>お名前</th>
                    <th>メールアドレス</th>
                    <th>件名</th>
                    <th>お問い合わせ内容</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="contact : ${contacts}">
                    <td th:text="${contact.name}"></td>
                    <td th:text="${contact.email}"></td>
                    <td th:text="${contact.subject}"></td>
                    <td th:text="${contact.content}"></td>
                    <td><button type="button" th:onclick="'location.href=\'/list/update/' + ${contact.id} + '\''">編集</button></td>
                    <td><button type="button" th:onclick="'location.href=\'/list/delete/' + ${contact.id} + '\''">削除</button></td>
                </tr>
            </tbody>
        </table>
    </div>
    <div th:text="${message}"></div>
    
<!-- ページリンク -->
    <div th:if="${pages?.totalPages > 1}">
        <ul class="paging">
            <li>
                <span th:if="${pages?.first}">&lt;&lt;</span>
                <a th:if="${not pages?.first}" th:href="@{${url}(page=0)}">&lt;&lt;</a>
            </li>
            <!-- 中間のページリンク -->
            <li th:each="i:${#numbers.sequence(0, pages?.totalPages-1)}">
                <span th:if="${i}==${pages?.number}" th:text="${i+1}"></span>
                <a th:if="${i}!=${pages?.number}" th:href="@{${url}(page=${i})}">
                    <span th:text="${i+1}"></span>
                </a>
            </li>
            <!-- 末尾のページリンク -->
            <li>
                <span th:if="${pages?.last}">&gt;&gt;</span>
                <a th:if="${not pages?.last}" th:href="@{${url}(page=(${pages?.totalPages-1}))}">
                    &gt;&gt;
                </a>
            </li>
        </ul>
    </div>
    <button type="button" onclick="location.href='/'" >トップに戻る</button>

  </body>
</html>
